<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#212121">
  <title>Bonsai · Local chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23212121'/%3E%3Cpath d='M24 10c-9 0-15 6-15 14s6 14 15 14 15-6 15-14S33 10 24 10zm0 6v16m-7-12 7 6 7-6' fill='none' stroke='%239cd6b6' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/highlight.css">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/vendor/marked.min.js" defer></script>
  <script src="/static/vendor/purify.min.js" defer></script>
  <script src="/static/vendor/highlight.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M12 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-7M16 3a2.1 2.1 0 0 1 3 3l-9 9-4 1 1-4Z"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="icon-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-14-2 18"/></symbol>
    <symbol id="icon-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Zm7 0v4m-2-2h4"/></symbol>
    <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2v-10A8.5 8.5 0 0 1 10.5 3h2a8.5 8.5 0 0 1 8.5 8.5Z"/><path d="M7 9h9M7 14h6"/></symbol>
    <symbol id="icon-leaf" viewBox="0 0 24 24"><path d="M19 4C9 3 4 7 4 13a7 7 0 0 0 7 7c6 0 9-6 8-16Z"/><path d="M5 19 15 9m-4 4v-4m0 4h4"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
  </svg>

  <div class="app-shell" id="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="Chat history">
      <div class="sidebar-top">
        <a class="brand" href="/" aria-label="Bonsai home"><span class="brand-mark"><svg class="icon"><use href="#icon-leaf"/></svg></span><span>Bonsai</span></a>
        <button class="icon-button sidebar-toggle" id="sidebar-close" type="button" aria-label="Close sidebar" title="Close sidebar"><svg class="icon"><use href="#icon-panel"/></svg></button>
      </div>
      <button class="new-chat" id="new-chat" type="button"><svg class="icon"><use href="#icon-edit"/></svg><span>New chat</span><kbd>Ctrl K</kbd></button>
      <label class="history-search"><svg class="icon"><use href="#icon-search"/></svg><input id="history-search" type="search" placeholder="Search chats" aria-label="Search chat titles" autocomplete="off"></label>
      <div class="history-scroll"><nav id="session-list" aria-label="Saved conversations"><p class="history-empty">Loading your chats…</p></nav></div>
      <div class="sidebar-footer"><div class="profile-avatar">B</div><div><strong>Your local workspace</strong><span>Chats saved on this computer</span></div></div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button" id="sidebar-open" type="button" aria-label="Open sidebar" aria-controls="sidebar" aria-expanded="true" title="Toggle sidebar"><svg class="icon"><use href="#icon-panel"/></svg></button>
          <button class="icon-button top-new-chat" id="top-new-chat" type="button" aria-label="New chat" title="New chat"><svg class="icon"><use href="#icon-edit"/></svg></button>
          <div class="model-heading"><label class="sr-only" for="model-select">Choose a local model</label><select id="model-select" aria-describedby="model-status-text" disabled><option value="">Loading models…</option></select><span class="local-label">Local</span></div>
        </div>
        <div class="model-status" id="model-status" title="Checking your model"><span class="status-dot"></span><span id="model-status-text">Connecting</span></div>
      </header>
      <div class="notification" id="notification" role="alert" hidden><span id="notification-text"></span><button class="icon-button" id="dismiss-notification" type="button" aria-label="Dismiss notification"><svg class="icon"><use href="#icon-close"/></svg></button></div>
      <div class="conversation-scroll" id="conversation-scroll">
        <section class="welcome" id="welcome" aria-label="Start a conversation">
          <div class="welcome-mark"><svg class="icon"><use href="#icon-leaf"/></svg></div>
          <h1>What can I help with?</h1>
          <p>Your ideas. Your model. Your own space.</p>
          <div class="suggestions">
            <button type="button" class="suggestion" data-prompt="Help me write a Python script. Ask me what it should do first."><svg class="icon"><use href="#icon-code"/></svg><strong>Write some code</strong><span>Build something, step by step</span></button>
            <button type="button" class="suggestion" data-prompt="Help me brainstorm an idea. Ask me what I am working on."><svg class="icon"><use href="#icon-spark"/></svg><strong>Explore an idea</strong><span>Find a fresh way to think</span></button>
            <button type="button" class="suggestion" data-prompt="Explain a concept simply. Ask me what I would like to understand."><svg class="icon"><use href="#icon-chat"/></svg><strong>Make it clear</strong><span>Understand something new</span></button>
          </div>
        </section>
        <div class="messages" id="messages" aria-label="Conversation" aria-live="off"></div>
      </div>
      <div class="composer-area" id="composer-area">
        <div class="generation-status" id="generation-status" role="status" aria-live="polite" hidden></div>
        <form class="composer" id="composer-form">
          <label class="sr-only" for="message-input">Message Bonsai</label>
          <textarea id="message-input" placeholder="Message Bonsai" rows="1" maxlength="100000" spellcheck="true"></textarea>
          <div class="composer-bottom"><span class="composer-hint">Enter to send <span>·</span> Shift + Enter for a new line</span><button class="send-button" id="send-button" type="submit" aria-label="Send message" title="Send message" disabled><svg class="icon"><use href="#icon-arrow"/></svg></button><button class="send-button stop-button" id="stop-button" type="button" aria-label="Stop generating" title="Stop generating" hidden><svg class="icon"><use href="#icon-stop"/></svg></button></div>
        </form>
        <p class="composer-footnote"><span id="model-context" hidden></span>Replies run on your computer. Models can make mistakes.</p>
      </div>
    </main>
  </div>

  <dialog class="edit-dialog" id="session-dialog" aria-labelledby="dialog-title">
    <form id="dialog-form">
      <div class="dialog-heading"><h2 id="dialog-title">Rename chat</h2><button class="icon-button" id="dialog-close" type="button" aria-label="Close dialog"><svg class="icon"><use href="#icon-close"/></svg></button></div>
      <p id="dialog-description" hidden></p>
      <label id="dialog-label" for="dialog-input">Chat title</label>
      <input id="dialog-input" maxlength="120" autocomplete="off" required>
      <p class="dialog-error" id="dialog-error" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" class="secondary-button" id="dialog-cancel">Cancel</button><button type="submit" class="primary-button" id="dialog-submit">Save</button></div>
    </form>
  </dialog>
  <div class="sr-only" id="screen-reader-status" role="status" aria-live="polite"></div>
</body>
</html>
